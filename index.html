<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bản vẽ (Web)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b3b73;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #title{position:fixed;top:10px;left:12px;right:12px;pointer-events:none}
  #title h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.4px}
  #title p{margin:3px 0 0;font-size:11px;opacity:.75}
  #legend{position:fixed;top:56px;left:12px;font-size:12px;line-height:1.5;background:rgba(7,40,84,.82);border:1px solid rgba(170,210,255,.5);border-radius:6px;max-width:80vw}
  #lgHead{padding:6px 11px;font-weight:700;color:#bfe0ff;cursor:pointer;user-select:none}
  #lgBody{padding:0 11px 8px;pointer-events:none}
  #legend.collapsed #lgBody{display:none}
  #legend b{color:#bfe0ff}
  #ui{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 10px;pointer-events:none}
  #ui>*{pointer-events:auto}
  #bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #ui.collapsed #bar{display:none}
  button{background:rgba(255,255,255,.1);border:1px solid rgba(190,220,255,.5);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  button.on{background:#2f8cf0;border-color:#9cc9ff}
  button:active{transform:scale(.96)}
  #bMenu{background:rgba(7,40,84,.85);font-size:12px;padding:5px 14px}
  #bMode{background:#e0452f;border-color:#ffb09f;font-weight:700}
  body.real .bp-only{display:none !important}
  body.bp .real-only{display:none !important}

  /* Bảng chọn cảnh */
  #scenes{position:fixed;top:56px;left:12px;width:min(236px,72vw);background:rgba(22,14,20,.86);border:1px solid rgba(255,190,120,.5);border-radius:10px;font-size:12px;color:#ffe9cf;backdrop-filter:blur(4px)}
  #scHead{padding:8px 12px;font-weight:700;color:#ffc98a;cursor:pointer;user-select:none}
  #scBody{padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
  #scenes.collapsed #scBody{display:none}
  .sc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:10px;padding:8px 11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,200,140,.3);color:#ffe9cf}
  .sc.on{background:#b5521c;border-color:#ffc08a;color:#fff}
  .sc b{font-size:13px}
  .sc small{opacity:.8;font-size:10.5px;margin-top:2px;line-height:1.35}
  #fade{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s ease}
</style>
</head>
<body class="bp">
<div id="title"><h1 id="ttl">BẢN VẼ 3D – LỒNG ĐÈN KÉO QUÂN (WEB)</h1><p>📱Kéo để xoay / Dùng hai ngón để Thu,Phóng</p></div>
<div id="legend" class="bp-only"><div id="lgHead">▾ Thông số</div><div id="lgBody"></div></div>

<div id="scenes" class="real-only">
  <div id="scHead">▾ Chọn cảnh</div>
  <div id="scBody">
    <button class="sc on" data-sc="bedroom"><b>🛏️ Phòng ngủ</b><small>Mô phỏng phòng ngủ!</small></button>
    <button class="sc" data-sc="wall"><b>Cạnh tường</b><small></small></button>
  </div>
</div>

<div id="ui">
  <button id="bMenu">▾ Ẩn</button>
  <div id="bar">
    <button id="bMode">Xem thực tế</button>
    <button id="bDim" class="on bp-only">Kích thước</button>
    <button id="bLight" class="on real-only">Nến sáng</button>
    <button id="bAuto">Tự xoay</button>
    <button id="bFan">Quay quạt</button>
    <button id="bMica" class="on">Ruột</button>
    <button id="bExp">Tách </button>
    <button id="bReset">Reset</button>
  </div>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var UNIT_CM = 10;
  var V = THREE.Vector3;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b3b73);

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  var canvasEl = renderer.domElement;
  var MAXANISO = renderer.capabilities.getMaxAnisotropy();

  var camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);

  function lin(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }

  var R = 1.0;
  var APO = R*Math.cos(Math.PI/6);
  var W = R, H = 2.0, T = 0.075, D = 0.045, LEG = 0.18;
  var TOP = LEG + H;
  var EX = 0.9, LIFT = 1.3;
  function cm(u){ var v = u*UNIT_CM; return (Math.round(v*10)/10).toString().replace('.',',') + ' cm'; }

  var ambient = new THREE.AmbientLight(0xffffff, 0.55); scene.add(ambient);
  var hemi = new THREE.HemisphereLight(0x8196cc, 0x1a1218, 0); scene.add(hemi);
  var key = new THREE.DirectionalLight(0xffffff, 0.7); key.position.set(3,5,4); scene.add(key);
  var key2 = new THREE.DirectionalLight(0xaad0ff, 0.35); key2.position.set(-4,2,-3); scene.add(key2);

  var FLAME_Y = LEG + 0.04 + 0.13;
  var candleLight = new THREE.PointLight(0xff8a30, 0, 34, 2.2);
  candleLight.position.set(0, FLAME_Y + 0.03, 0);
  candleLight.castShadow = false;
  candleLight.shadow.mapSize.set(1024, 1024);
  candleLight.shadow.camera.near = 0.05;
  candleLight.shadow.camera.far = 40;
  candleLight.shadow.bias = -0.004;
  candleLight.shadow.radius = 2;
  
  var bounce = new THREE.PointLight(0xff9a50, 0, 16, 2);
  bounce.position.set(0, 0.95, 0);

  var grid = new THREE.GridHelper(14, 56, 0x7fb4ee, 0x2b66a8);
  grid.position.y = -0.002;
  scene.add(grid);

  function radialTex(stops, sx, sy, size){
    var c = document.createElement('canvas'); c.width = c.height = size;
    var g = c.getContext('2d');
    g.translate(size/2, size/2); g.scale(sx, sy);
    var gr = g.createRadialGradient(0,0,0,0,0,size/2);
    for(var i=0;i<stops.length;i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = gr; g.fillRect(-size/2/sx, -size/2/sy, size/sx, size/sy);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    return t;
  }

  var glow = (function(){
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,'rgba(255,170,80,0.55)');
    gr.addColorStop(0.4,'rgba(255,120,60,0.18)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0,0,256,256);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    var m = new THREE.Mesh(new THREE.PlaneGeometry(9,9),
      new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}));
    m.rotation.x = -Math.PI/2; m.position.y = 0.004; m.visible = false; m.renderOrder = 1;
    scene.add(m);
    return m;
  })();

  var frameMat = new THREE.MeshStandardMaterial({color:0x3d82cc, roughness:0.8});
  var foamMat  = new THREE.MeshStandardMaterial({color:0x5b9be0, roughness:0.9});
  var woodMat  = new THREE.MeshStandardMaterial({color:0xe0c080, roughness:0.8});
  var bladeMat = new THREE.MeshStandardMaterial({color:0x9cc9f5, roughness:0.8, side:THREE.DoubleSide});
  var edgeMat  = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.9});

  var paperGrad = (function(){
    var c = document.createElement('canvas'); c.width = 4; c.height = 256;
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,'#9c9c9c'); gr.addColorStop(0.5,'#d2d2d2'); gr.addColorStop(0.85,'#ffffff'); gr.addColorStop(1,'#ffffff');
    g.fillStyle = gr; g.fillRect(0,0,4,256);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    return t;
  })();
  var paperMat = new THREE.MeshStandardMaterial({color:0xeaf4ff, roughness:0.9, transparent:true, opacity:0.35, side:THREE.DoubleSide, depthWrite:false,
    emissive:0xffa050, emissiveMap:paperGrad, emissiveIntensity:0});

  function edges(mesh, angle){
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle||20), edgeMat));
    return mesh;
  }
  function caster(mesh){ mesh.castShadow = true; return mesh; }

  var lantern = new THREE.Group();
  scene.add(lantern);
  lantern.add(candleLight);
  lantern.add(bounce);
  var panelInners = [];
  var cy = LEG + H/2;

  for(var i=0;i<6;i++){
    var outer = new THREE.Group();
    outer.rotation.y = i*Math.PI/3;
    var inner = new THREE.Group();
    inner.position.z = APO;
    outer.add(inner);

    var post = new THREE.BoxGeometry(T, H+LEG, D);
    var pl = caster(edges(new THREE.Mesh(post, frameMat))); pl.position.set(-(W/2-T/2), cy-LEG/2, 0);
    var pr = caster(edges(new THREE.Mesh(post, frameMat))); pr.position.set((W/2-T/2), cy-LEG/2, 0);
    var bar = new THREE.BoxGeometry(W-2*T, T, D);
    var bt = caster(edges(new THREE.Mesh(bar, frameMat))); bt.position.set(0, cy+H/2-T/2, 0);
    var bb = caster(edges(new THREE.Mesh(bar, frameMat))); bb.position.set(0, cy-H/2+T/2, 0);
    inner.add(pl,pr,bt,bb);

    var paper = new THREE.Mesh(new THREE.PlaneGeometry(W-2*T+0.02, H-2*T+0.02), paperMat);
    paper.position.set(0, cy, 0);
    inner.add(paper);

    lantern.add(outer);
    panelInners.push(inner);
  }

  var base = caster(edges(new THREE.Mesh(new THREE.CylinderGeometry(R*0.98,R*0.98,0.04,6), foamMat)));
  base.rotation.y = Math.PI/6; base.position.y = LEG+0.02;
  lantern.add(base);

  var candle = new THREE.Group();
  candle.position.y = LEG+0.04;
  var cup = caster(new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,0.07,32),
    new THREE.MeshStandardMaterial({color:0xdfe6ee, metalness:0.6, roughness:0.4})));
  cup.position.y = 0.035;
  var wax = caster(new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.06,32),
    new THREE.MeshStandardMaterial({color:0xfff4d6})));
  wax.position.y = 0.05;
  var flame = new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16), new THREE.MeshBasicMaterial({color:0xffd27a}));
  flame.scale.set(1,1.9,1); flame.position.y = 0.13; flame.visible = false;
  
  var flameSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex([[0,'rgba(255,245,210,1)'],[0.3,'rgba(255,190,90,0.8)'],[0.65,'rgba(255,120,30,0.3)'],[1,'rgba(255,80,0,0)']], 0.6, 1, 128),
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
  flameSpr.scale.set(0.22, 0.4, 1); flameSpr.position.y = 0.14; flameSpr.visible = false;
  
  var haloSpr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex([[0,'rgba(255,190,100,0.7)'],[0.4,'rgba(255,140,50,0.25)'],[1,'rgba(255,100,20,0)']], 1, 1, 256),
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true}));
  haloSpr.scale.set(1.5, 1.5, 1); haloSpr.visible = false;
  candle.add(cup,wax,flame,flameSpr,haloSpr);
  lantern.add(candle);

  var topGroup = new THREE.Group();
  lantern.add(topGroup);

  var shape = new THREE.Shape();
  for(var k=0;k<6;k++){
    var a = k*Math.PI/3;
    var x = R*Math.cos(a), y = R*Math.sin(a);
    if(k===0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  var hole = new THREE.Path(); hole.absarc(0,0,0.72,0,Math.PI*2,true);
  shape.holes.push(hole);
  var plate = caster(edges(new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.04,bevelEnabled:false}), foamMat), 30));
  plate.rotation.x = -Math.PI/2;
  plate.position.y = TOP;
  topGroup.add(plate);

  var cross = caster(edges(new THREE.Mesh(new THREE.BoxGeometry(1.7,0.025,0.1), foamMat)));
  cross.position.y = TOP - 0.0125;
  topGroup.add(cross);

  // ---------- ĐÃ ĐẶT LẠI VỊ TRÍ QUẠT KHỚP VỚI LỖ NẮP ----------
  var fan = new THREE.Group();
  fan.position.y = TOP + 0.02; // Đã hạ từ +0.12 xuống +0.02 để quạt nằm đúng bề mặt lỗ nắp
  fan.add(caster(edges(new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,0.04,24), foamMat))));
  var ring = caster(new THREE.Mesh(new THREE.RingGeometry(0.72,0.8,64), bladeMat));
  ring.rotation.x = -Math.PI/2;
  fan.add(ring);
  var N = 18;
  for(var b=0;b<N;b++){
    var pivot = new THREE.Group();
    pivot.rotation.y = b*2*Math.PI/N;
    var blade = caster(edges(new THREE.Mesh(new THREE.BoxGeometry(0.66,0.008,0.17), bladeMat)));
    blade.position.x = 0.42;
    blade.rotation.x = 0.8;
    pivot.add(blade);
    fan.add(pivot);
  }
  topGroup.add(fan);

  var micaH = H*0.9;
  var mica = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72,0.72,micaH,64,1,true),
    new THREE.MeshStandardMaterial({color:0xcfe8ff, transparent:true, opacity:0.14, side:THREE.DoubleSide, depthWrite:false})
  );
  mica.position.y = TOP - micaH/2 - 0.02;
  lantern.add(mica);

  function mkPlaster(rx, ry, base){
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0,0,256,256);
    for(var i=0;i<5000;i++){
      var v = Math.random()<0.5 ? 0 : 255;
      g.fillStyle = 'rgba('+v+','+v+','+v+','+(Math.random()*0.07)+')';
      g.fillRect(Math.random()*256, Math.random()*256, 1+Math.random()*2, 1+Math.random()*2);
    }
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    t.anisotropy = MAXANISO;
    return t;
  }
  function mkWood(rx, ry){
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var g = c.getContext('2d');
    var planks = 8, pw = 512/planks;
    for(var p=0;p<planks;p++){
      var hh = 24 + Math.random()*8, ss = 36 + Math.random()*14, ll = 22 + Math.random()*12;
      g.fillStyle = 'hsl('+hh+','+ss+'%,'+ll+'%)'; g.fillRect(p*pw, 0, pw, 512);
      for(var n=0;n<40;n++){
        var gx = p*pw + Math.random()*pw;
        g.strokeStyle = Math.random()<0.5 ? 'rgba(0,0,0,'+(0.05+Math.random()*0.1)+')' : 'rgba(255,220,170,'+(0.03+Math.random()*0.06)+')';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(gx, 0);
        for(var yy=32; yy<=512; yy+=32) g.lineTo(gx + (Math.random()-0.5)*2, yy);
        g.stroke();
      }
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(p*pw, 0, 1.5, 512);
      g.fillRect(p*pw, Math.random()*512, pw, 1.5);
    }
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
    t.anisotropy = MAXANISO;
    return t;
  }
  function std(hex, rough){ return new THREE.MeshStandardMaterial({color:lin(hex), roughness:rough}); }
  function box(g, w,h,d, x,y,z, mat, cast){
    var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z); m.castShadow = (cast !== false); m.receiveShadow = true;
    g.add(m); return m;
  }

  var mWoodDark = std(0x4a3426,0.6), mWood = std(0x6b4a32,0.55), mSheet = std(0xe4dfd6,0.95),
      mBlanket = std(0x2e4a58,0.95), mPillow = std(0xf0ece4,0.95), mRug = std(0x7a3030,1),
      mCurt = std(0xcbbd9f,1), mWard = std(0x5a4232,0.6), mFrameDk = std(0x2b2018,0.5),
      mCanvas = std(0xb8c4cc,0.9), mSkirt = std(0xefe9df,0.7), mBook = std(0x3a5a3a,0.8);
  var mGlass = new THREE.MeshBasicMaterial({color:lin(0x1a2745)});

  var roomBed = new THREE.Group(); roomBed.visible = false; scene.add(roomBed);
  (function(){
    var wallT = function(){ return new THREE.MeshStandardMaterial({map:mkPlaster(4,2.5,'#d9d1c4'), roughness:0.95, side:THREE.BackSide}); };
    var shellMats = [
      wallT(), wallT(),
      new THREE.MeshStandardMaterial({map:mkPlaster(4,4,'#ebe7df'), roughness:0.95, side:THREE.BackSide}),
      new THREE.MeshStandardMaterial({map:mkWood(5,5), roughness:0.5, side:THREE.BackSide}),
      wallT(), wallT()
    ];
    var shell = new THREE.Mesh(new THREE.BoxGeometry(28,18,28), shellMats);
    shell.position.y = 9; shell.receiveShadow = true;
    roomBed.add(shell);

    box(roomBed, 15,2.5,20, -6,1.25,-4, mWoodDark);
    box(roomBed, 15.4,7,0.8, -6,3.5,-13.6, mWoodDark);
    box(roomBed, 14.4,2,18.8, -6,3.5,-3.8, mSheet);
    box(roomBed, 5.6,1.2,3, -9.6,5.1,-11.4, mPillow);
    box(roomBed, 5.6,1.2,3, -2.4,5.1,-11.4, mPillow);
    box(roomBed, 14.8,0.6,12, -6,4.8,0, mBlanket);
    box(roomBed, 5,5,4.4, 4.5,2.5,-11.2, mWood);
    box(roomBed, 4.4,1.6,0.1, 4.5,3.6,-8.95, mWoodDark);
    box(roomBed, 1,0.18,0.18, 4.5,3.6,-8.85, mFrameDk);
    box(roomBed, 1.4,0.3,1.8, 6.3,5.15,-11.2, mBook);
    box(roomBed, 7,4.5,0.25, -6,10.5,-13.85, mFrameDk);
    box(roomBed, 6.2,3.7,0.1, -6,10.5,-13.72, mCanvas);
    box(roomBed, 4,14,10, 12,7,3, mWard);
    box(roomBed, 0.1,13.4,0.12, 9.95,7,3, mFrameDk, false);
    box(roomBed, 0.18,1.2,0.18, 9.9,7,2.5, mSkirt, false);
    box(roomBed, 0.18,1.2,0.18, 9.9,7,3.5, mSkirt, false);
    box(roomBed, 11,0.08,8, -2,0.04,9.5, mRug, false);
    box(roomBed, 0.1,7,5, -13.9,11,2, mGlass, false);
    box(roomBed, 0.25,0.4,5.8, -13.85,14.7,2, mSkirt, false);
    box(roomBed, 0.25,0.4,5.8, -13.85,7.3,2, mSkirt, false);
    box(roomBed, 0.25,7.4,0.4, -13.85,11,-0.7, mSkirt, false);
    box(roomBed, 0.25,7.4,0.4, -13.85,11,4.7, mSkirt, false);
    box(roomBed, 0.25,0.3,5, -13.85,11,2, mSkirt, false);
    box(roomBed, 0.25,7,0.25, -13.85,11,2, mSkirt, false);
    box(roomBed, 0.7,11,1.8, -13.6,9.5,-1.6, mCurt);
    box(roomBed, 0.7,11,1.8, -13.6,9.5,5.6, mCurt);
    box(roomBed, 28,0.5,0.25, 0,0.25,-13.875, mSkirt, false);
    box(roomBed, 0.25,0.5,28, -13.875,0.25,0, mSkirt, false);
    box(roomBed, 0.25,0.5,28, 13.875,0.25,0, mSkirt, false);
    box(roomBed, 28,0.5,0.25, 0,0.25,13.875, mSkirt, false);
  })();

  var roomWall = new THREE.Group(); roomWall.visible = false; scene.add(roomWall);
  (function(){
    var floor = new THREE.Mesh(new THREE.BoxGeometry(60,0.4,60),
      new THREE.MeshStandardMaterial({map:mkWood(7.5,7.5), roughness:0.5}));
    floor.position.y = -0.2; floor.receiveShadow = true; floor.castShadow = true;
    roomWall.add(floor);
    var wall = new THREE.Mesh(new THREE.BoxGeometry(60,24,0.4),
      new THREE.MeshStandardMaterial({map:mkPlaster(8,3.2,'#d9d1c4'), roughness:0.95}));
    wall.position.set(0,12,-5.2); wall.receiveShadow = true; wall.castShadow = true;
    roomWall.add(wall);
    box(roomWall, 60,0.6,0.25, 0,0.3,-4.9, mSkirt, false);
  })();

  var curScene = 'bedroom';
  var SCENES = {
    bedroom:{pos:new V(4.5,5,-11.2), theta:-0.55, phi:1.28, rk:1.0,  fog:0,     glowS:0.55},
    wall:   {pos:new V(0,0,0),       theta:0.5,   phi:1.3,  rk:0.9,  fog:0.014, glowS:1.0}
  };

  var dims = new THREE.Group();
  scene.add(dims);
  var DIMCOL = 0xffe066;
  var lineMat = new THREE.LineBasicMaterial({color:DIMCOL, transparent:true, opacity:0.65, depthTest:false});

  function makeLabel(text){
    var c = document.createElement('canvas'); c.width = 512; c.height = 96;
    var g = c.getContext('2d');
    g.fillStyle = 'rgba(7,40,84,0.9)'; g.fillRect(0,0,512,96);
    g.strokeStyle = '#ffe066'; g.lineWidth = 3; g.strokeRect(1.5,1.5,509,93);
    g.fillStyle = '#ffe066';
    g.font = 'bold 40px system-ui, Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 256, 50);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true}));
    s.scale.set(1.15, 0.215, 1);
    s.renderOrder = 20;
    return s;
  }
  function makeSeg(){
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6),3));
    var l = new THREE.Line(g, lineMat);
    l.frustumCulled = false; l.renderOrder = 10;
    dims.add(l);
    return l;
  }
  function setSeg(l, p, q){
    var arr = l.geometry.attributes.position.array;
    arr[0]=p.x; arr[1]=p.y; arr[2]=p.z; arr[3]=q.x; arr[4]=q.y; arr[5]=q.z;
    l.geometry.attributes.position.needsUpdate = true;
  }
  function makeArrow(){
    var ar = new THREE.ArrowHelper(new V(1,0,0), new V(), 1, DIMCOL, 0.1, 0.05);
    ar.line.material.depthTest = false; ar.cone.material.depthTest = false;
    ar.line.renderOrder = 10; ar.cone.renderOrder = 10;
    ar.line.frustumCulled = false;
    dims.add(ar);
    return ar;
  }
  var dimList = [];
  function addDim(text, fn, labOff){
    var d = {fn:fn, e1:makeSeg(), e2:makeSeg(), a1:makeArrow(), a2:makeArrow(), lab:makeLabel(text), labOff:labOff||new V()};
    dims.add(d.lab);
    dimList.push(d);
  }
  function updateDims(e){
    for(var i=0;i<dimList.length;i++){
      var d = dimList[i], pts = d.fn(e);
      var n = pts.off.clone().normalize().multiplyScalar(0.06);
      var a = pts.p1.clone().add(pts.off), b = pts.p2.clone().add(pts.off);
      setSeg(d.e1, pts.p1, a.clone().add(n));
      setSeg(d.e2, pts.p2, b.clone().add(n));
      var mid = a.clone().add(b).multiplyScalar(0.5);
      var dir = b.clone().sub(a), len = dir.length(); dir.normalize();
      d.a1.position.copy(mid); d.a1.setDirection(dir.clone().negate()); d.a1.setLength(len/2, 0.1, 0.05);
      d.a2.position.copy(mid); d.a2.setDirection(dir);                  d.a2.setLength(len/2, 0.1, 0.05);
      d.lab.position.copy(mid).add(d.labOff);
    }
  }

  addDim('Chiều cao ' + cm(TOP), function(e){
    return {p1:new V(R,0,0), p2:new V(R,TOP+LIFT*e,0), off:new V(0.6+0.6*e,0,0)};
  });
  addDim('Khung ' + cm(H), function(e){
    return {p1:new V(-W/2,LEG,APO+EX*e), p2:new V(-W/2,TOP,APO+EX*e), off:new V(-0.45,0,0.2)};
  });
  addDim('Độ rộng giữa 2 chân ' + cm(W), function(e){
    return {p1:new V(-W/2,0,APO+EX*e), p2:new V(W/2,0,APO+EX*e), off:new V(0,0,0.55)};
  });
  addDim('Ø Đế ' + cm(2*R), function(e){
    return {p1:new V(-R,0,0), p2:new V(R,0,0), off:new V(0,0,-1.35)};
  });
  addDim('Đế ' + cm(2*APO), function(e){
    return {p1:new V(0,0,-APO), p2:new V(0,0,APO), off:new V(-1.75,0,0)};
  });
  addDim('Quạt Ø' + cm(1.6), function(e){
    return {p1:new V(-0.8,TOP+0.12+LIFT*e,0), p2:new V(0.8,TOP+0.12+LIFT*e,0), off:new V(0,0.5,0)};
  }, new V(0,0.2,0));
  updateDims(0);

  var items = [
    ['Tính từ chân tới đỉnh', TOP], ['Khung', H], ['Khoảng cách 2 chân', W],
    ['Ø mặt đế (đỉnh–đỉnh)', 2*R], ['Ø mặt đế (đối cạnh)', 2*APO], ['Ø quạt', 1.6], ['Chân', LEG]
  ];
  document.getElementById('lgBody').innerHTML =
    items.map(function(it){ return '<b>' + it[0] + ':</b> ' + cm(it[1]); }).join('<br>');

  var target = new THREE.Vector3(0, 1.2, 0);
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function defRadius(){
    var asp = window.innerWidth/window.innerHeight;
    return clamp(2.6/(Math.tan(20*Math.PI/180)*asp), 8.5, 20);
  }
  var def = {theta:0.7, phi:1.15, r:defRadius()};
  var theta = def.theta, phi = def.phi, radius = def.r;
  var vTheta = 0, vPhi = 0, targetRadius = radius;
  var phiMax = Math.PI-0.1;
  var autoRotate = false;
  var pointers = {};
  var lastPinch = 0;
  var MAXR = 26;

  canvasEl.addEventListener('pointerdown', function(e){
    canvasEl.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    var ids = Object.keys(pointers);
    if(ids.length===2){
      var p = pointers[ids[0]], q = pointers[ids[1]];
      lastPinch = Math.hypot(p.x-q.x, p.y-q.y);
    }
    vTheta = vPhi = 0;
  });
  canvasEl.addEventListener('pointermove', function(e){
    var p = pointers[e.pointerId];
    if(!p) return;
    var ids = Object.keys(pointers);
    if(ids.length===1){
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      theta -= dx*0.008; phi = clamp(phi - dy*0.008, 0.1, phiMax);
      vTheta = -dx*0.008; vPhi = -dy*0.008;
      p.x = e.clientX; p.y = e.clientY;
    } else if(ids.length===2){
      p.x = e.clientX; p.y = e.clientY;
      var a = pointers[ids[0]], c2 = pointers[ids[1]];
      var d = Math.hypot(a.x-c2.x, a.y-c2.y);
      if(lastPinch>0){ targetRadius = clamp(targetRadius * (lastPinch/d), 2.5, MAXR); }
      lastPinch = d;
    }
  });
  function up(e){ delete pointers[e.pointerId]; lastPinch = 0; }
  canvasEl.addEventListener('pointerup', up);
  canvasEl.addEventListener('pointercancel', up);
  canvasEl.addEventListener('wheel', function(e){
    e.preventDefault();
    targetRadius = clamp(targetRadius * Math.exp(e.deltaY*0.0012), 2.5, MAXR);
  }, {passive:false});

  var mode = 'bp', dimsOn = true, candleOn = true, fanOn = false, explode = 0, explodeTarget = 0;
  var legend = document.getElementById('legend');
  var bFan = document.getElementById('bFan');
  var scenesPanel = document.getElementById('scenes');
  var fadeEl = document.getElementById('fade'), busy = false;

  function transition(fn){
    if(busy) return;
    busy = true; fadeEl.style.opacity = 1;
    setTimeout(function(){
      fn(); fadeEl.style.opacity = 0;
      setTimeout(function(){ busy = false; }, 370);
    }, 370);
  }

  function setEncoding(real){
    renderer.toneMapping = real ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputEncoding = real ? THREE.sRGBEncoding : THREE.LinearEncoding;
    scene.traverse(function(o){
      var m = o.material; if(!m) return;
      (Array.isArray(m) ? m : [m]).forEach(function(mm){ mm.needsUpdate = true; });
    });
  }

  function applyScene(name){
    curScene = name;
    var cfg = SCENES[name];
    roomBed.visible = (name === 'bedroom');
    roomWall.visible = (name === 'wall');
    lantern.position.copy(cfg.pos);
    target.set(cfg.pos.x, cfg.pos.y + 1.3, cfg.pos.z);
    def.theta = cfg.theta; def.phi = cfg.phi; def.r = defRadius()*cfg.rk;
    theta = def.theta; phi = def.phi; targetRadius = def.r; radius = def.r; vTheta = vPhi = 0;
    phiMax = 1.5;
    scene.fog = cfg.fog ? new THREE.FogExp2(lin(0x07050a), cfg.fog) : null;
    glow.position.set(cfg.pos.x, cfg.pos.y + 0.004, cfg.pos.z);
    glow.scale.set(cfg.glowS, cfg.glowS, 1);
    glow.visible = true;
    var btns = document.querySelectorAll('.sc');
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-sc') === name);
    scene.traverse(function(o){ var m=o.material; if(m){ (Array.isArray(m)?m:[m]).forEach(function(mm){ mm.needsUpdate = true; }); } });
  }

  function applyMode(){
    var real = (mode === 'real');
    document.body.className = real ? 'real' : 'bp';
    document.body.style.background = real ? '#0a0710' : '#0b3b73';
    setEncoding(real);
    scene.background = real ? lin(0x0a0710) : new THREE.Color(0x0b3b73);
    grid.visible = !real;
    edgeMat.visible = !real;
    key2.visible = !real;
    candleLight.castShadow = real;
    if(real){
      frameMat.color.copy(lin(0xc8102e)); foamMat.color.copy(lin(0xf3eee6));
      woodMat.color.copy(lin(0xc89a5b));  bladeMat.color.copy(lin(0xe9d7b2));
      paperMat.color.copy(lin(0xfff3df)); paperMat.opacity = 0.85;
      paperMat.emissive.copy(lin(0xffb464));
      frameMat.emissive.copy(lin(0x7a1020));
      foamMat.emissive.copy(lin(0x6a4a30));
      bladeMat.emissive.copy(lin(0x6a4a30));
      applyScene(curScene);
      scenesPanel.classList.remove('collapsed');
      document.getElementById('scHead').textContent = '▾ Chọn cảnh';
    } else {
      frameMat.color.set(0x3d82cc); foamMat.color.set(0x5b9be0);
      woodMat.color.set(0xe0c080);  bladeMat.color.set(0x9cc9f5);
      paperMat.color.set(0xeaf4ff); paperMat.opacity = 0.35;
      paperMat.emissiveIntensity = 0;
      frameMat.emissive.set(0x000000); foamMat.emissive.set(0x000000); bladeMat.emissive.set(0x000000);
      candleLight.intensity = 0; bounce.intensity = 0;
      flame.visible = flameSpr.visible = haloSpr.visible = false;
      roomBed.visible = roomWall.visible = false;
      glow.visible = false;
      scene.fog = null;
      lantern.position.set(0,0,0);
      target.set(0,1.2,0);
      phiMax = Math.PI-0.1;
      def.theta = 0.7; def.phi = 1.15; def.r = defRadius();
      theta = def.theta; phi = def.phi; targetRadius = def.r; radius = def.r; vTheta = vPhi = 0;
    }
    dims.visible = !real && dimsOn;
    legend.style.display = (!real && dimsOn) ? 'block' : 'none';
    document.getElementById('ttl').textContent = real ? 'LỒNG ĐÈN KÉO QUÂN 3D' : 'BẢN VẼ 3D – LỒNG ĐÈN KÉO QUÂN (WEB)';
    document.getElementById('bMode').textContent = real ? 'Xem bản vẽ' : 'Xem thực tế';
    if(real){ fanOn = true; bFan.classList.add('on'); }
  }

  function toggle(id, fn){
    var el = document.getElementById(id);
    el.addEventListener('click', function(){ fn(el); });
  }
  if(window.innerWidth < 700){ legend.classList.add('collapsed'); document.getElementById('lgHead').textContent = '▸ Thông số'; }
  document.getElementById('lgHead').addEventListener('click', function(){
    var c = legend.classList.toggle('collapsed');
    this.textContent = (c ? '▸' : '▾') + ' Thông số';
  });
  document.getElementById('scHead').addEventListener('click', function(){
    var c = scenesPanel.classList.toggle('collapsed');
    this.textContent = (c ? '▸' : '▾') + ' Chọn cảnh';
  });
  var scBtns = document.querySelectorAll('.sc');
  for(var sb=0; sb<scBtns.length; sb++){
    scBtns[sb].addEventListener('click', function(){
      var name = this.getAttribute('data-sc');
      if(name === curScene) return;
      transition(function(){ applyScene(name); });
    });
  }
  var ui = document.getElementById('ui');
  toggle('bMenu', function(el){
    var c = ui.classList.toggle('collapsed');
    el.textContent = c ? '▴ Hiện' : '▾ Ẩn';
  });
  toggle('bMode', function(){ transition(function(){ mode = (mode==='bp') ? 'real' : 'bp'; applyMode(); }); });
  toggle('bDim', function(el){
    dimsOn = !dimsOn; el.classList.toggle('on', dimsOn);
    dims.visible = dimsOn; legend.style.display = dimsOn ? 'block' : 'none';
  });
  toggle('bLight', function(el){ candleOn = !candleOn; el.classList.toggle('on', candleOn); });
  toggle('bAuto', function(el){ autoRotate = !autoRotate; el.classList.toggle('on', autoRotate); });
  toggle('bFan', function(el){ fanOn = !fanOn; el.classList.toggle('on', fanOn); });
  toggle('bMica', function(el){ mica.visible = !mica.visible; el.classList.toggle('on', mica.visible); });
  toggle('bExp', function(el){ explodeTarget = explodeTarget?0:1; el.classList.toggle('on', !!explodeTarget); });
  toggle('bReset', function(){ targetRadius = def.r; theta = def.theta; phi = def.phi; vTheta = vPhi = 0; });

  var fanSpeed = 0, lit = 0, t0 = performance.now();
  var flk = 1, flkT = 1, nextFlk = 0;
  function animate(now){
    requestAnimationFrame(animate);
    var dt = Math.min((now - t0)/1000, 0.05); t0 = now;
    var real = (mode === 'real');

    if(Object.keys(pointers).length===0){
      theta += vTheta; phi = clamp(phi + vPhi, 0.1, phiMax);
      vTheta *= 0.93; vPhi *= 0.93;
      if(autoRotate) theta += dt*0.35;
    }
    radius += (targetRadius - radius)*0.15;
    camera.position.set(
      target.x + radius*Math.sin(phi)*Math.sin(theta),
      target.y + radius*Math.cos(phi),
      target.z + radius*Math.sin(phi)*Math.cos(theta)
    );
    camera.lookAt(target);

    lit += ((real && candleOn ? 1 : 0) - lit)*0.12;
    if(now > nextFlk){ flkT = 0.84 + Math.random()*0.26; nextFlk = now + 60 + Math.random()*120; }
    flk += (flkT - flk)*0.2;
    var flick = (real && candleOn) ? (flk + 0.04*Math.sin(now*0.017)) : 1;
    if(real){
      var sx = Math.sin(now*0.0093)*0.012 + (flk-1)*0.02;
      var sz = Math.cos(now*0.0071)*0.012;
      candleLight.position.set(sx, FLAME_Y + 0.03, sz);
      candleLight.intensity = 1.9*lit*flick;
      bounce.intensity = 0.5*lit*flick;

      var vis = lit > 0.05;
      flame.visible = flameSpr.visible = haloSpr.visible = vis;
      flame.scale.set(0.95+0.05*flick, 1.9*flick, 0.95+0.05*flick);
      flameSpr.scale.set(0.2*(0.9+0.2*flick), 0.38*flick, 1);
      flameSpr.material.opacity = lit;
      haloSpr.scale.setScalar(1.35 + 0.25*flick);
      haloSpr.material.opacity = lit*(0.8+0.2*flick);

      paperMat.emissiveIntensity = 0.95*lit*(0.92+0.08*flick);
      frameMat.emissiveIntensity = 0.6*lit;
      foamMat.emissiveIntensity = 0.5*lit;
      bladeMat.emissiveIntensity = 0.5*lit;

      ambient.intensity = 0.04 + 0.22*(1-lit);
      hemi.intensity = 0.12 + 0.3*(1-lit);
      key.intensity = 0.25*(1-lit);
      glow.material.opacity = 0.45*(0.1 + 0.9*lit)*(0.9+0.1*flick);
    } else {
      ambient.intensity = 0.55; hemi.intensity = 0; key.intensity = 0.7;
    }

    var spin = fanOn && (!real || candleOn);
    fanSpeed += ((spin?2.6:0) - fanSpeed)*0.03;
    fan.rotation.y += fanSpeed*dt;

    explode += (explodeTarget - explode)*0.1;
    for(var j=0;j<panelInners.length;j++) panelInners[j].position.z = APO + explode*EX;
    topGroup.position.y = explode*LIFT;
    mica.position.y = TOP - micaH/2 - 0.02 + explode*LIFT/2;
    if(dims.visible) updateDims(explode);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
